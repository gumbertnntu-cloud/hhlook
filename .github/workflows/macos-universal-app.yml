name: Build macOS Universal App

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos-universal:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build HHLook universal app
        shell: bash
        run: |
          chmod +x ./scripts/build_macos_universal_app.sh
          ./scripts/build_macos_universal_app.sh

      - name: Verify app binary architectures
        shell: bash
        run: |
          APP_BIN="dist/HHLook.app/Contents/MacOS/HHLook"
          test -f "${APP_BIN}"
          file "${APP_BIN}"
          lipo -archs "${APP_BIN}"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HHLook-macos-universal
          path: |
            dist/HHLook.app
            dist/HHLook-macOS-universal.zip
            dist/HHLook-macOS-universal.dmg

      - name: Attach macOS assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/HHLook-macOS-universal.zip
            dist/HHLook-macOS-universal.dmg
          generate_release_notes: true
