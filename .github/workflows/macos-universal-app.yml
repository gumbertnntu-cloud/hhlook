name: Build macOS Apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            python_arch: x64
            arch_label: intel
          - os: macos-14
            python_arch: arm64
            arch_label: apple-silicon
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python_arch }}

      - name: Build HHLook app (${{ matrix.arch_label }})
        shell: bash
        run: |
          chmod +x ./scripts/build_macos_universal_app.sh
          ./scripts/build_macos_universal_app.sh "${{ matrix.arch_label }}"

      - name: Verify app binary architecture
        shell: bash
        run: |
          APP_BIN="dist/HHLook-${{ matrix.arch_label }}.app/Contents/MacOS/HHLook"
          test -f "${APP_BIN}"
          file "${APP_BIN}"
          lipo -archs "${APP_BIN}"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HHLook-macos-${{ matrix.arch_label }}
          path: |
            dist/HHLook-${{ matrix.arch_label }}.app
            dist/HHLook-macOS-${{ matrix.arch_label }}.zip
            dist/HHLook-macOS-${{ matrix.arch_label }}.dmg

      - name: Attach macOS assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/HHLook-macOS-${{ matrix.arch_label }}.zip
            dist/HHLook-macOS-${{ matrix.arch_label }}.dmg
